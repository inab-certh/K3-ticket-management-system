{% load form_extras %}

<h4 class="mb-3">Βήμα 4: Καταγραφή Νεοπλασμάτων</h4>
<div class="row mb-4">
  <div class="col-md-2">
    <label class="form-label">ID Ωφελούμενου</label>
    <input type="text" class="form-control" value="{{ beneficiary_id }}" readonly>
  </div>
  <div class="col-md-4">
    <label class="form-label">Όνομα</label>
    <input type="text" class="form-control" value="{{ beneficiary_form.first_name.value }}" readonly>
  </div>
  <div class="col-md-4">
    <label class="form-label">Επώνυμο</label>
    <input type="text" class="form-control" value="{{ beneficiary_form.last_name.value }}" readonly>
  </div>
</div>

<div id="neoplasms-container" class="mt-3"></div>

<script>
const icd10Categories = {{ icd10_categories_json|safe }};
const icd10Subcategories = {{ icd10_subcategories_json|safe }};
const icd10Codes = {{ icd10_codes_json|safe }};

const therapyTypes = [
  {value: "chemotherapy", label: "Χημειοθεραπεία"},
  {value: "radiotherapy", label: "Ακτινοθεραπεία"},
  {value: "hormone_therapy", label: "Ορμονοθεραπεία"},
  {value: "targeted_therapy", label: "Στοχευμένη θεραπεία"},
  {value: "immunotherapy", label: "Ανοσοθεραπεία"},
  {value: "gene_therapy", label: "Γονιδιακή"},
  {value: "alternative", label: "Εναλλακτική"},
  {value: "stem_cell", label: "Βλαστοκύτταρα"},
  {value: "other", label: "Άλλη θεραπεία"},
];

function getCategoryOptions() {
  return icd10Categories.map(c =>
    `<option value="${c.id}">${c.name}</option>`
  ).join('');
}

function getSubcategoryOptions(categoryId) {
  return icd10Subcategories
    .filter(s => s.category_id === categoryId)
    .map(s => `<option value="${s.id}">${s.name}</option>`)
    .join('');
}

function getCodeOptions(subcategoryId) {
  return icd10Codes
    .filter(c => c.subcategory_id === subcategoryId)
    .map(c => `<option value="${c.id}">${c.code} - ${c.label}</option>`)
    .join('');
}

function getTherapiesHtml(neoplasmIdx) {
  return `
    <div class="therapy-list" data-neoplasm-index="${neoplasmIdx}">
      <div class="row g-2 align-items-end therapy-box mb-2" data-therapy-index="0">
        <div class="col-md-5">
          <label class="form-label">Είδος Θεραπείας</label>
          <select class="form-select" name="therapy_type_${neoplasmIdx}_0">
            <option value="">Επιλέξτε...</option>
            ${therapyTypes.map(t => `<option value="${t.value}">${t.label}</option>`).join("")}
          </select>
        </div>
        <div class="col-md-5">
          <label class="form-label">Νοσοκομείο</label>
          <input type="text" class="form-control" name="therapy_hospital_${neoplasmIdx}_0" placeholder="Νοσοκομείο">
        </div>
        <div class="col-md-2 text-end">
          <button type="button" class="btn btn-danger btn-sm remove-therapy">Διαγραφή</button>
        </div>
      </div>
    </div>
    <button type="button" class="btn btn-outline-primary btn-sm mt-2 add-therapy">+ Προσθήκη Θεραπείας</button>
  `;
}

function getNeoplasmBoxHtml(index, showAdd, showDelete) {
  return `
    <div class="card p-4 mb-4 neoplasm-box" data-index="${index}">
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label class="form-label">Κατηγορία Νεοπλάσματος</label>
          <select class="form-select category" name="category_id_${index}">
            <option value="">Επιλέξτε...</option>
            ${getCategoryOptions()}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Είδος</label>
          <select class="form-select subcategory" name="subcategory_id_${index}" disabled>
            <option value="">Επιλέξτε...</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">ICD-10</label>
          <select class="form-select icd10code" name="icd10_id_${index}" disabled>
            <option value="">Επιλέξτε...</option>
          </select>
        </div>
        <div class="col-md-12">
          <label class="form-label">Εντοπισμός</label>
          <input type="text" class="form-control localization" name="localization_${index}" placeholder="Ελεύθερο κείμενο">
        </div>
      </div>
      <hr class="my-3">
      <div class="row mb-2">
        <div class="col-md-2">
          <label class="form-label">Μεταστάσεις</label><br>
          <input type="checkbox" name="metastasis_${index}" class="metastasis">
          <label>Ναι</label>
        </div>
        <div class="col-md-3">
          <label class="form-label">Χειρουργική επέμβαση</label><br>
          <input type="checkbox" name="surgery_${index}" class="surgery">
          <label>Ναι</label>
        </div>
        <div class="col-md-4 surgery-hospital-group" style="display:none;">
          <label class="form-label">Νοσοκομείο Χειρουργείου</label>
          <input type="text" class="form-control" name="surgery_hospital_${index}">
        </div>
        <div class="col-md-3">
		  <label class="form-label">Προγραμματισμένη Χειρουργική Επέμβαση</label><br>
		  <input type="checkbox" name="scheduled_surgery_${index}" class="scheduled-surgery">
		  <label>Ναι</label>
		</div>
      </div>
      <div class="row mb-2">
        <div class="col-md-3">
          <label class="form-label">Θεραπείες</label>
          <input type="checkbox" class="has-therapies" name="has_therapies_${index}">
          <label>Ναι</label>
        </div>
      </div>
      <div class="therapies-section" style="display:none;">
        ${getTherapiesHtml(index)}
      </div>
      <div class="col-md-12 text-end mt-3">
        <div class="d-flex justify-content-between">
          <div>
            ${showAdd ? '<button type="button" class="btn btn-outline-primary btn-sm add-neoplasm">+ Προσθήκη Νεοπλάσματος</button>' : ''}
          </div>
          <div>
            ${showDelete ? '<button type="button" class="btn btn-danger btn-sm remove-neoplasm">Διαγραφή</button>' : ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

const container = document.getElementById('neoplasms-container');

function renderNeoplasms(data) {
  container.innerHTML = '';
  for (let i = 0; i < data.length; i++) {
    const isLast = i === data.length - 1;
    const showDelete = data.length > 1 || i > 0;
    container.insertAdjacentHTML('beforeend', getNeoplasmBoxHtml(i, isLast, showDelete));
    const box = container.lastElementChild;
    // Restore category
    if (data[i].category_id) {
      const catSel = box.querySelector('.category');
      catSel.value = data[i].category_id;
      const subcatSel = box.querySelector('.subcategory');
      subcatSel.innerHTML = '<option value="">Επιλέξτε...</option>' + getSubcategoryOptions(parseInt(data[i].category_id));
      subcatSel.disabled = false;
      if (data[i].subcategory_id) {
        subcatSel.value = data[i].subcategory_id;
        const codeSel = box.querySelector('.icd10code');
        codeSel.innerHTML = '<option value="">Επιλέξτε...</option>' + getCodeOptions(parseInt(data[i].subcategory_id));
        codeSel.disabled = false;
        if (data[i].icd10_id) codeSel.value = data[i].icd10_id;
      }
    }
    box.querySelector('.localization').value = data[i].localization || '';
  }
}

function addNeoplasmBox() {
  const data = [];
  container.querySelectorAll('.neoplasm-box').forEach(box => {
    data.push({
      category_id: box.querySelector('.category').value,
      subcategory_id: box.querySelector('.subcategory').value,
      icd10_id: box.querySelector('.icd10code').value,
      localization: box.querySelector('.localization').value,
    });
  });
  data.push({category_id: '', subcategory_id: '', icd10_id: '', localization: ''});
  renderNeoplasms(data);
}

// Initialize with one empty box
const existingNeoplasms = {{ existing_neoplasms_json|safe }};
const initialData = existingNeoplasms.length > 0 
  ? existingNeoplasms 
  : [{category_id: '', subcategory_id: '', icd10_id: '', localization: ''}];
renderNeoplasms(initialData);

container.addEventListener('click', function(e) {
  const box = e.target.closest('.neoplasm-box');
  if (!box) return;

  if (e.target.classList.contains('add-neoplasm')) {
    addNeoplasmBox();
  }

  if (e.target.classList.contains('remove-neoplasm')) {
    const data = [];
    container.querySelectorAll('.neoplasm-box').forEach(b => {
      if (b !== box) data.push({
        category_id: b.querySelector('.category').value,
        subcategory_id: b.querySelector('.subcategory').value,
        icd10_id: b.querySelector('.icd10code').value,
        localization: b.querySelector('.localization').value,
      });
    });
    if (data.length === 0) data.push({category_id: '', subcategory_id: '', icd10_id: '', localization: ''});
    renderNeoplasms(data);
  }

  if (e.target.classList.contains('add-therapy')) {
    const therapyList = box.querySelector('.therapy-list');
    const nidx = box.dataset.index;
    const currentCount = therapyList.querySelectorAll('.therapy-box').length;
    if (currentCount >= 3) return;
    const html = `
      <div class="row g-2 align-items-end therapy-box mb-2" data-therapy-index="${currentCount}">
        <div class="col-md-5">
          <label class="form-label">Είδος Θεραπείας</label>
          <select class="form-select" name="therapy_type_${nidx}_${currentCount}">
            <option value="">Επιλέξτε...</option>
            ${therapyTypes.map(t => `<option value="${t.value}">${t.label}</option>`).join("")}
          </select>
        </div>
        <div class="col-md-5">
          <label class="form-label">Νοσοκομείο</label>
          <input type="text" class="form-control" name="therapy_hospital_${nidx}_${currentCount}" placeholder="Νοσοκομείο">
        </div>
        <div class="col-md-2 text-end">
          <button type="button" class="btn btn-danger btn-sm remove-therapy">Διαγραφή</button>
        </div>
      </div>`;
    therapyList.insertAdjacentHTML('beforeend', html);
  }

  if (e.target.classList.contains('remove-therapy')) {
    e.target.closest('.therapy-box').remove();
  }
});

container.addEventListener('change', function(e) {
  const box = e.target.closest('.neoplasm-box');
  if (!box) return;

  if (e.target.classList.contains('category')) {
    const categoryId = parseInt(e.target.value);
    const subcatSel = box.querySelector('.subcategory');
    const codeSel = box.querySelector('.icd10code');
    subcatSel.innerHTML = '<option value="">Επιλέξτε...</option>' + getSubcategoryOptions(categoryId);
    subcatSel.disabled = !categoryId;
    codeSel.innerHTML = '<option value="">Επιλέξτε...</option>';
    codeSel.disabled = true;
  }

  if (e.target.classList.contains('subcategory')) {
    const subcatId = parseInt(e.target.value);
    const codeSel = box.querySelector('.icd10code');
    codeSel.innerHTML = '<option value="">Επιλέξτε...</option>' + getCodeOptions(subcatId);
    codeSel.disabled = !subcatId;
  }

  if (e.target.classList.contains('surgery')) {
    box.querySelector('.surgery-hospital-group').style.display = e.target.checked ? '' : 'none';
  }

  if (e.target.classList.contains('has-therapies')) {
    box.querySelector('.therapies-section').style.display = e.target.checked ? '' : 'none';
  }
});
</script>
